# Save as: .github/workflows/daily-analysis.yml  (must be on the default branch)
#
# Rules implemented:
#   * Window: 01:00 - 15:00 UTC, once per day, max 5.5h per run
#   * Started before 01:00 (00:00-00:59) -> wait until 01:00
#   * Started late                       -> hard stop at 15:00 UTC
#   * Started 15:00 - 23:59              -> skipped quietly (logged as a notice, run stays green, no email)
#   * Several cron triggers act as retries; once a successful run exists today, the rest exit cleanly
#   * Every .py file in the repo is discovered automatically (minus EXCLUDE_REGEX)
#   * Each script runs as its own matrix job = its own separate console/log
#   * A script still running at the deadline is stopped and counts as a NORMAL finish
#     (the BTC bot loops forever by design, so the deadline is its expected end)

name: daily-analysis

env:
  # Python files matching this regex are NOT run (helpers, tests, packaging files...).
  # Paths are relative to repo root. Add more alternatives with |
  EXCLUDE_REGEX: '(^|/)(__init__|setup|conftest)\.py$|^tests?/|^\.github/'
  PYTHON_VERSION: "3.12"
  WINDOW_START: "01:00"      # UTC
  WINDOW_END: "15:00"        # UTC
  MAX_RUN_SECONDS: "19800"   # 5.5 hours
  MIN_RUN_SECONDS: "600"     # don't bother starting if less than 10 min remain

on:
  schedule:
    # Off the top of the hour on purpose (GitHub is busiest at :00).
    # Extra triggers are retries in case GitHub delays/drops one.
    - cron: "7 1 * * *"
    - cron: "7 5 * * *"
    - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a successful run already exists today (window still enforced)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Never let two runs overlap (e.g. a slow 01:07 run and the 05:07 retry).
concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Job 1: discover scripts, decide whether to run, wait for the window,
  #        compute the shared deadline
  # -------------------------------------------------------------------------
  gate:
    name: Time-window gate
    runs-on: ubuntu-latest
    timeout-minutes: 90   # covers waiting up to 1h before the window opens
    outputs:
      run: ${{ steps.gate.outputs.run }}
      deadline: ${{ steps.gate.outputs.deadline }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover scripts, check window, compute deadline
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          echo "run=false" >> "$GITHUB_OUTPUT"   # default; overwritten below on success

          today=$(date -u +%F)
          window_start=$(date -u -d "$today $WINDOW_START:00" +%s)
          window_end=$(date -u -d "$today $WINDOW_END:00" +%s)

          # 0) Discover every tracked .py file, minus exclusions
          files=$(git ls-files -- '*.py' | grep -Ev "$EXCLUDE_REGEX" || true)
          if [ -z "$files" ]; then
            echo "::notice::No Python scripts found. Nothing to do."
            exit 0
          fi
          echo "Discovered scripts:"; echo "$files"
          matrix=$(echo "$files" | jq -R . | jq -sc '{script: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          # 1) Already succeeded today? (retries exit cleanly)
          if [ "${FORCE:-false}" != "true" ]; then
            done_count=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow daily-analysis.yml --status success \
              --created ">=$today" --json databaseId --jq 'length')
            if [ "$done_count" -gt 0 ]; then
              echo "::notice::A successful run already exists for $today UTC. Nothing to do."
              exit 0
            fi
          fi

          now=$(date -u +%s)

          # 2) Too early (00:00-00:59 UTC): wait until the window opens
          if [ "$now" -lt "$window_start" ]; then
            wait=$(( window_start - now ))
            echo "Started early. Waiting ${wait}s until $WINDOW_START UTC..."
            sleep "$wait"
            now=$(date -u +%s)
          fi

          # 3) Too late (15:00-23:59 UTC): skip quietly (green run, no notification)
          remaining_window=$(( window_end - now ))
          if [ "$remaining_window" -lt "$MIN_RUN_SECONDS" ]; then
            echo "::notice::Started at $(date -u +%T) UTC, outside the $WINDOW_START-$WINDOW_END window (or too little time left). Skipping today's run."
            exit 0
          fi

          # 4) Deadline = min(now + 5.5h, 15:00 UTC)
          max_end=$(( now + MAX_RUN_SECONDS ))
          deadline=$(( max_end < window_end ? max_end : window_end ))
          echo "Deadline: $(date -u -d "@$deadline" '+%F %T') UTC"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "deadline=$deadline" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Job 2: one job per script, each with its own console, sharing the deadline
  # -------------------------------------------------------------------------
  run:
    name: ${{ matrix.script }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340   # backstop only; the real cutoff is the deadline below
    strategy:
      fail-fast: false     # one failing script doesn't kill the others
      # max-parallel: 1    # uncomment to run scripts one after another instead
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run ${{ matrix.script }} (hard stop at deadline)
        env:
          DEADLINE: ${{ needs.gate.outputs.deadline }}
          SCRIPT: ${{ matrix.script }}
        run: |
          set -uo pipefail
          # leave 30s for the kill-after grace period so we never pass the deadline
          remaining=$(( DEADLINE - $(date -u +%s) - 30 ))
          if [ "$remaining" -lt 60 ]; then
            echo "::notice::Deadline already reached before $SCRIPT could start. Skipping."
            exit 0
          fi
          echo "Running $SCRIPT with ${remaining}s budget (until $(date -u -d "@$DEADLINE" +%T) UTC)"

          # SIGTERM at the deadline (lets Python clean up), SIGKILL 30s later
          timeout --signal=TERM --kill-after=30 "$remaining" python -u "$SCRIPT"
          code=$?

          # 124 = stopped by timeout, 137 = had to be killed after the grace period.
          # Reaching the deadline is the expected end for long-running scripts.
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "::notice::$SCRIPT reached the deadline and was stopped (normal)."
            exit 0
          fi
          exit "$code"
