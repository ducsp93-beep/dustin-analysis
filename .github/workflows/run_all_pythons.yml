name: Daily Run

# Place this file at .github/workflows/daily.yml (and delete the old root-level run.yml).
#
# Behaviour
#   * Runs once per day, only inside the 01:00-15:00 UTC window.
#   * Each run job lasts at most 5.5h and never past 15:00 UTC.
#   * Every *.py file in the repo gets its own job (= its own console), all in parallel.
#   * Several backup crons exist in case GitHub delays or drops one; the gate skips
#     silently when today's run has already been claimed by an earlier trigger.

on:
  schedule:
    # Off the top of the hour on purpose (GitHub is busiest at :00). All times UTC.
    - cron: "13 1 * * *"   # primary
    - cron: "13 5 * * *"   # backup
    - cron: "13 9 * * *"   # backup
    - cron: "13 13 * * *"  # backup (leaves ~1h45 of runtime)

permissions:
  contents: read
  actions: read

env:
  OPEN_SECS: 3600        # window opens  01:00 UTC (seconds after midnight)
  CLOSE_SECS: 54000      # window closes 15:00 UTC
  MAX_RUN_SECS: 19800    # 5.5 hours
  MIN_RUN_SECS: 1800     # skip if less than 30 min would remain
  WORKFLOW_FILE: daily.yml

jobs:
  # ---------------------------------------------------------------- gate
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90          # only ever waits up to ~1h
    permissions:
      contents: read
      actions: write             # needed only for the keepalive call below
    outputs:
      run: ${{ steps.decide.outputs.run }}
      scripts: ${{ steps.scripts.outputs.scripts }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Best effort: re-enable call so GitHub's 60-day inactivity auto-disable
      # does not silently stop the schedule. Never fails the run.
      - name: Keepalive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/$WORKFLOW_FILE/enable"

      - name: Decide - wait, run or skip
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          midnight=$(date -u -d "$(date -u +%F) 00:00:00" +%s)
          open=$((midnight + OPEN_SECS))
          close=$((midnight + CLOSE_SECS))

          now=$(date -u +%s)
          if (( now < open )); then
            echo "Too early ($(date -u +%T) UTC): waiting $((open - now))s for 01:00 UTC"
            sleep $((open - now))
            now=$(date -u +%s)
          fi

          if (( close - now < MIN_RUN_SECS )); then
            echo "Less than $((MIN_RUN_SECS / 60)) min left before 15:00 UTC: skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Has an earlier trigger today already started (or finished) the job?
          today=$(date -u +%F)
          mine=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .created_at)
          others=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?created=$today&per_page=100" \
            | jq -r --arg mine "$mine" --argjson cur "$RUN_ID" '
                .workflow_runs[]
                | select(.id != $cur
                         and (.created_at < $mine or (.created_at == $mine and .id < $cur)))
                | "\(.id) \(.status)"')

          claimed=false
          while read -r id status; do
            [ -z "${id:-}" ] && continue
            if [ "$status" != "completed" ]; then
              echo "Earlier run $id ($status) owns today's slot: skipping"
              claimed=true; break
            fi
            n=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              | jq '[.jobs[] | select(.name | startswith("run")) | select(.conclusion != "skipped")] | length')
            if [ "$n" -gt 0 ]; then
              echo "Earlier run $id already did today's job: skipping"
              claimed=true; break
            fi
          done <<< "$others"

          if [ "$claimed" = true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Go: $(date -u +%T) UTC, $(( (close - now) / 60 )) min until 15:00 UTC"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover Python files
        id: scripts
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          json=$(git ls-files '*.py' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Scripts: $json"
          echo "scripts=$json" >> "$GITHUB_OUTPUT"
          if [ "$json" = "[]" ]; then echo "No .py files found"; fi

  # ----------------------------------------------------------------- run
  run:
    # One job per script, so each script has its own console/log.
    name: run (${{ matrix.script }})
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.scripts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 345         # backstop, under the 360-min hosted-runner cap
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.gate.outputs.scripts) }}
    steps:
      # Computed first, so runner queue time between gate and run is accounted for.
      - name: Compute deadline
        id: dl
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          midnight=$(date -u -d "$(date -u +%F) 00:00:00" +%s)
          close=$((midnight + CLOSE_SECS))
          cap=$((now + MAX_RUN_SECS))
          deadline=$(( cap < close ? cap : close ))
          remaining=$((deadline - now))
          if (( remaining < MIN_RUN_SECS )); then
            echo "Only $((remaining / 60)) min left before 15:00 UTC: skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Deadline: $(date -u -d @"$deadline" +'%F %T') UTC ($((remaining / 60)) min from now)"
            echo "DEADLINE=$deadline" >> "$GITHUB_ENV"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repo
        if: steps.dl.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.dl.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.dl.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.script }}
        if: steps.dl.outputs.go == 'true'
        env:
          SCRIPT: ${{ matrix.script }}
          PYTHONUNBUFFERED: "1"
        run: |
          remaining=$((DEADLINE - $(date -u +%s)))
          if (( remaining < 60 )); then
            echo "Setup used up the time budget: nothing to run"
            exit 0
          fi
          echo "Running $SCRIPT for up to $((remaining / 60)) min (until $(date -u -d @"$DEADLINE" +%T) UTC)"
          set +e
          timeout --signal=TERM --kill-after=30 "$remaining" python -u "$SCRIPT"
          rc=$?
          set -e
          # 124 = stopped by timeout (expected: the bot streams forever); 137 = needed SIGKILL
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "Stopped at deadline as planned"
            exit 0
          fi
          exit "$rc"
