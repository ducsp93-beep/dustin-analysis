name: Trade Count Monitor

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch:       # manual run button

concurrency:
  group: trade-count-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install websockets aiohttp

      - name: Run monitor (stops after 5h 50m)
        run: timeout --signal=INT 350m python trade_count_10sec_monitor.py || [ $? -eq 124 ]
