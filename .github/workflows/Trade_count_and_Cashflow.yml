name: Market monitors

on:
  schedule:
    - cron: '40 0 * * *'   # window 01:00-05:00 UTC
    - cron: '40 4 * * *'   # window 05:00-10:00 UTC
    - cron: '40 9 * * *'   # window 10:00-15:00 UTC
  workflow_dispatch:       # manual test: runs for 10 minutes

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # safety net only; the real deadline is enforced below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt
      
      - name: Run scripts inside the window
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Map the cron that fired to its window (UTC)
          case "$SCHEDULE" in
            "40 0 * * *") START=01:00; END=05:00 ;;
            "40 4 * * *") START=05:00; END=10:00 ;;
            "40 9 * * *") START=10:00; END=15:00 ;;
            *)  # manual run
                START=$(date -u +%H:%M)
                END=$(date -u -d "+10 minutes" +%H:%M) ;;
          esac

          start_ts=$(date -u -d "today $START" +%s)
          end_ts=$(date -u -d "today $END" +%s)
          now=$(date -u +%s)

          # Too late: window already over
          if [ "$now" -ge "$end_ts" ]; then
            echo "Window $START-$END UTC already over, skipping."
            exit 0
          fi

          # Started early (cron is set 20 min ahead): wait for the window to open
          if [ "$now" -lt "$start_ts" ]; then
            wait_s=$(( start_ts - now ))
            if [ "$wait_s" -gt 1800 ]; then
              echo "Too early / wrong day, skipping."
              exit 0
            fi
            echo "Waiting ${wait_s}s until $START UTC"
            sleep "$wait_s"
          fi

          # Hard stop at END, no matter how late we started
          remaining=$(( end_ts - $(date -u +%s) ))
          echo "Running for ${remaining}s, until $END UTC"

          for f in cash_flow_thick.py cash_flow_thin.py trade_count_12sec.py; do
            timeout -k 10 "$remaining" python -u "$f" &
          done
          wait
          echo "Window closed."
