name: Market monitors Cashflow and Trade count

on:
  schedule:
    - cron: '40 0 * * *'   # window 01:00-05:00 UTC
    - cron: '40 4 * * *'   # window 05:00-10:00 UTC
    - cron: '40 9 * * *'   # window 10:00-15:00 UTC
  workflow_dispatch:        # manual run: behaves like the scheduled window it falls in

permissions:
  contents: read
  actions: read             # needed so the prepare job can list other runs

jobs:
  prepare:
    name: Decide window
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.win.outputs.skip }}
      start_ts: ${{ steps.win.outputs.start_ts }}
      end_ts: ${{ steps.win.outputs.end_ts }}
    steps:
      - id: win
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: Trade_count_and_Cashflow.yml
        run: |
          python3 - <<'EOF'
          import os, json, subprocess, datetime as dt

          WINDOWS = [("01:00", "05:00"), ("05:00", "10:00"), ("10:00", "15:00")]
          CRONS   = {"40 0 * * *": 0, "40 4 * * *": 1, "40 9 * * *": 2}
          LEAD    = 20 * 60   # schedule fires 20 min before the window starts

          def sec(hhmm):
              h, m = hhmm.split(":")
              return int(h) * 3600 + int(m) * 60

          def window_for(sod):
              """Window index for a UTC seconds-of-day (incl. the 20-min lead), else None."""
              for i, (s, e) in enumerate(WINDOWS):
                  if sec(s) - LEAD <= sod < sec(e):
                      return i
              return None

          def sod_of(t):
              return t.hour * 3600 + t.minute * 60 + t.second

          def out(**kw):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  for k, v in kw.items():
                      f.write(f"{k}={v}\n")

          now = dt.datetime.now(dt.timezone.utc)
          event = os.environ["EVENT"]

          if event == "schedule":
              idx = CRONS.get(os.environ["SCHEDULE"])
          else:
              idx = window_for(sod_of(now))

          if idx is None:
              print("Manual run outside all windows (15:00-00:40 UTC), skipping.")
              out(skip="true", start_ts=0, end_ts=0)
              raise SystemExit

          s, e = WINDOWS[idx]
          midnight = now.replace(hour=0, minute=0, second=0, microsecond=0)
          start_ts = int((midnight + dt.timedelta(seconds=sec(s))).timestamp())
          end_ts   = int((midnight + dt.timedelta(seconds=sec(e))).timestamp())
          print(f"Window {s}-{e} UTC")

          # A scheduled run yields if a manual run already covers the same window today
          if event == "schedule":
              for status in ("in_progress", "queued"):
                  res = subprocess.run(
                      ["gh", "run", "list", "--workflow", os.environ["WORKFLOW_FILE"],
                       "--event", "workflow_dispatch", "--status", status,
                       "--json", "databaseId,createdAt", "--limit", "20"],
                      capture_output=True, text=True, check=True)
                  for r in json.loads(res.stdout or "[]"):
                      if str(r["databaseId"]) == os.environ["RUN_ID"]:
                          continue
                      created = dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
                      if created.date() == now.date() and window_for(sod_of(created)) == idx:
                          print(f"Manual run {r['databaseId']} already covers this window, skipping.")
                          out(skip="true", start_ts=start_ts, end_ts=end_ts)
                          raise SystemExit

          out(skip="false", start_ts=start_ts, end_ts=end_ts)
          EOF

  run:
    name: ${{ matrix.script }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340   # safety net only; the real deadline is enforced below
    strategy:
      fail-fast: false
      matrix:
        script:
          - cash_flow_thick.py
          - cash_flow_thin.py
          - trade_count_12sec.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run script inside the window
        env:
          START_TS: ${{ needs.prepare.outputs.start_ts }}
          END_TS: ${{ needs.prepare.outputs.end_ts }}
          SCRIPT: ${{ matrix.script }}
        run: |
          now=$(date -u +%s)
          if [ "$now" -ge "$END_TS" ]; then
            echo "Window already over, skipping."
            exit 0
          fi
          if [ "$now" -lt "$START_TS" ]; then
            wait_s=$(( START_TS - now ))
            echo "Waiting ${wait_s}s until window start"
            sleep "$wait_s"
          fi
          remaining=$(( END_TS - $(date -u +%s) ))
          echo "Running $SCRIPT for ${remaining}s, until $(date -u -d @$END_TS +%H:%M) UTC"
          timeout -k 10 "$remaining" python -u "$SCRIPT" || echo "Stopped (exit $?)"
          echo "Window closed."
