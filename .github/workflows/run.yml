name: BTC Daily Analysis

on:
  schedule:
    - cron: "0 1 * * *"  # Every day at 1:00 AM UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "How long to run (hours)"
        default: "23"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 1380  # 23 hours - GitHub Actions max is 6 hours for free tier, 35 hours for enterprise
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run analysis for 23 hours
        env:
          HOURS: ${{ github.event.inputs.hours || '23' }}
        run: |
          # Calculate duration in seconds (23 hours = 82800 seconds)
          DURATION=$((${HOURS} * 3600))
          echo "Running script for ${HOURS} hours (${DURATION} seconds)"
          timeout $DURATION python BTC_Matched_order_aggressive_and_resting_analysis.py || true
