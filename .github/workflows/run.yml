name: BTC Daily Analysis

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "How long to run (hours)"
        default: "5"

jobs:
  btc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run BTC analysis
        env:
          HOURS: ${{ github.event.inputs.hours || '5' }}
        run: |
          DURATION=$((${HOURS} * 3600))
          timeout $DURATION python BTC_Matched_order_aggressive_and_resting_analysis.py || true

  orderbook-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Coinbase orderbook monitor
        env:
          HOURS: ${{ github.event.inputs.hours || '5' }}
        run: |
          DURATION=$((${HOURS} * 3600))
          timeout $DURATION python coinbase_orderbook_monitor_v3.py || true
