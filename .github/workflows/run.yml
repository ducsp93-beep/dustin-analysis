name: BTC stream

on:
  schedule:
    - cron: "0 18 * * 0-4"   # 01:00 ICT Mon-Fri
    - cron: "0 22 * * 0-4"   # 05:00 ICT Mon-Fri
    - cron: "0 4 * * 1-5"    # 11:00 ICT Mon-Fri
  workflow_dispatch:
    inputs:
      hours:
        description: "How long to run (hours)"
        default: "4"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client requests
      - name: Run for the window
        env:
          SCHEDULE: ${{ github.event.schedule }}
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          case "$SCHEDULE" in
            "0 18 * * 0-4") D=12600 ;;   # 3.5h
            "0 22 * * 0-4") D=18000 ;;   # 5h
            "0 4 * * 1-5")  D=14400 ;;   # 4h
            *) D=$(( ${HOURS:-4} * 3600 )) ;;   # manual run
          esac
          timeout $D python BTC_Matched_order_aggressive_and_resting_analysis.py || true
