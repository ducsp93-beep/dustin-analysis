name: Run all Python files

on:
  workflow_dispatch:   # manual trigger only

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # (1) Find all .py files and give each one a delay index (0, 1, 2, ...)
      - name: List python files
        id: list
        run: |
          matrix=$(find . -name '*.py' \
            -not -path './.git/*' -not -path './.github/*' \
            | sed 's|^\./||' | sort \
            | jq -R -s -c 'split("\n")[:-1] | to_entries | map({file: .value, delay: .key})')
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one failing script doesn't cancel the others
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    # (4) each job = its own console/log, named after the file
    name: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # (3) stagger starts: file #0 waits 0s, #1 waits 1s, #2 waits 2s, ...
      - name: Stagger start
        run: |
          echo "Waiting ${{ matrix.delay }}s before starting"
          sleep ${{ matrix.delay }}

      # (2) all matrix jobs run in parallel
      - name: Run ${{ matrix.file }}
        run: python -u "${{ matrix.file }}"
